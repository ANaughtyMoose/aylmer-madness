<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aylmer Madness — house materials</title>
<style>
html,body{margin:0;height:100%;background:#1a2028;color:#fff;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:14px;left:16px;font-size:14px;opacity:.88;line-height:1.6;text-shadow:0 1px 3px #000}
#ui b{font-size:18px;display:block}
#ui small{opacity:.75}
#err{position:fixed;inset:20% 10%;font:14px/1.5 monospace;white-space:pre-wrap;color:#ff9a8a;display:none}
</style></head><body>
<canvas id="gl"></canvas>
<div id="ui"><b id="name">loading atlas…</b><span id="info"></span><br><small id="help"></small></div>
<div id="err"></div>
<script type="module">
import { Renderer } from './src/core/gl.js';
import { m4 } from './src/core/math.js';
import { loadMaterials } from './src/game/materials.js';
import { buildDemoScene, SAMPLES, WALLS, ROOFS } from './src/game/houses_demo.js';

const r = new Renderer(document.getElementById('gl'));
r.setEnvironment({
  sky: [0.62, 0.70, 0.82], ground: [0.30, 0.31, 0.29], sun: [0.92, 0.87, 0.78],
  lightDir: [0.42, 0.78, 0.46], fog: [0.70, 0.76, 0.84], fogDensity: 0.0016,
});

let mats = null, mesh = null, tris = 0;
let wallShift = 0, roofShift = 0, textured = true, seam = false;
let yaw = 0.6, pitch = -0.26, dist = 34, drag = null, spinning = true;
const mm = m4.create();

function rebuild() {
  const samples = SAMPLES.map((s, i) => ({
    ...s,
    wall: WALLS[(WALLS.indexOf(s.wall) + wallShift + WALLS.length * 9) % WALLS.length],
    roof: ROOFS[(ROOFS.indexOf(s.roof) + roofShift + ROOFS.length * 9) % ROOFS.length],
  }));
  const mb = buildDemoScene(mats, { samples, seam: seam ? samples[0].wall : null });
  mesh = r.upload(mb);
  tris = mb.i.length / 3;
  const bytes = mb.v.length * 4 + mb.uv.length * 4 + mb.rect.length * 4 + mb.i.length * 4;
  document.getElementById('name').textContent = samples.map((s) => s.wall).join(' · ');
  document.getElementById('info').textContent =
    `${samples.map((s) => s.roof).join(' · ')} — ${tris} tris, ${mb.vertCount} verts, `
    + `${(bytes / 1024).toFixed(0)} kB, 1 draw call`;
}

addEventListener('keydown', (e) => {
  if (e.code === 'KeyW') { wallShift++; rebuild(); }
  if (e.code === 'KeyR') { roofShift++; rebuild(); }
  if (e.code === 'KeyG') { seam = !seam; rebuild(); }
  if (e.code === 'KeyT') textured = !textured;
  if (e.code === 'Space') spinning = !spinning;
});
addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  yaw += (e.clientX - drag[0]) * 0.008;
  pitch = Math.max(-1.3, Math.min(-0.02, pitch + (e.clientY - drag[1]) * 0.005));
  drag = [e.clientX, e.clientY];
});
addEventListener('wheel', (e) => { dist = Math.max(6, Math.min(120, dist + e.deltaY * 0.03)); });

function frame(t) {
  requestAnimationFrame(frame);
  if (!mesh) return;
  const spin = yaw + (spinning && !drag ? t * 0.00008 : 0);
  const cp = [Math.sin(spin) * dist * Math.cos(pitch), 6 - Math.sin(pitch) * dist,
    Math.cos(spin) * dist * Math.cos(pitch)];
  r.begin(cp, spin, pitch, 0.85);
  m4.identity(mm);
  r.draw(mesh, mm, textured ? { tex: mats.tex } : undefined);
  r.end();
}

loadMaterials(r).then(() => {
  document.getElementById('help').textContent =
    'drag orbit · wheel zoom · W walls · R roofs · G seam slab · T texture off · space stop';
  rebuild();
  requestAnimationFrame(frame);
}).catch((e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Could not load the material atlas.\n' + e.message
    + '\n\nRun tools/make_atlas.py, then serve over http:// with ./serve.sh';
});
</script></body></html>
