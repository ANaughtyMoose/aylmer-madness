<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aylmer Madness — Ottawa landmark lab</title>
<style>
html,body{margin:0;height:100%;background:#1a2028;color:#fff;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:14px;left:16px;font-size:13px;line-height:1.7;background:rgba(16,20,26,.72);
    padding:12px 14px;border-radius:8px;min-width:250px}
#ui b{font-size:16px;display:block;margin-bottom:6px}
#ui select,#ui button{font:inherit;background:#242c36;color:#fff;border:1px solid #3a4450;
    border-radius:4px;padding:3px 6px;margin:2px 0;width:100%}
#ui button{cursor:pointer;width:auto;padding:3px 10px}
#stats{opacity:.75;margin-top:8px;white-space:pre-line;font-family:Menlo,monospace;font-size:12px}
#hint{position:fixed;bottom:12px;left:16px;font-size:12px;opacity:.55}
label{opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
</style></head><body>
<canvas id="gl"></canvas>
<div id="ui">
  <b>Ottawa landmark lab</b>
  <label>landmark</label>
  <select id="pick"></select>
  <label>lod</label>
  <select id="lod">
    <option value="near">near — full detail</option>
    <option value="far">far — massing and roofline</option>
  </select>
  <label>eye</label>
  <select id="eye">
    <option value="driver">driver — 1.5 m, across the street</option>
    <option value="orbit">orbit — the whole building</option>
  </select>
  <div id="stats"></div>
</div>
<div id="hint">drag to orbit · wheel to zoom · ← → cycle landmark · space pause spin</div>
<script type="module" src="./ottawa_lab.js"></script>
</body></html>
