<!doctype html><meta charset="utf-8"><title>Aylmer audio game verification</title>
<style>body{background:#172129;color:#eee;font:15px system-ui}iframe{width:1100px;height:680px;border:0}button{padding:12px}pre{white-space:pre-wrap;max-height:500px;overflow:auto}</style>
<h1>Audio implementation · in-game verification</h1><p>Uses isolated review saves and library. Includes real keyboard events, reload and moving scene samples.</p>
<button id="run">Run game checks</button><pre id="result">Ready</pre><iframe id="game" src="../prototype.html?audioReview=1" allow="autoplay"></iframe>
<script type="module">
const frame=document.querySelector('#game'),result=document.querySelector('#result'),button=document.querySelector('#run');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,ms=20000){const t=performance.now();while(!fn()){if(performance.now()-t>ms)throw Error('Timeout '+fn);await wait(100);}}
let report=[];function check(name,pass,detail){report.push({name,pass:!!pass,detail});result.textContent=JSON.stringify({running:true,report},null,2);if(!pass)throw Error(name);}
function key(w,code,shift=false,type='keydown',target=w){target.dispatchEvent(new w.KeyboardEvent(type,{code,key:code==='KeyR'?'r':code,shiftKey:shift,bubbles:true}));}
async function tap(w,code){key(w,code);key(w,code,false,'keyup');await wait(150);}
async function chord(w,shift='ShiftLeft'){key(w,shift);key(w,'KeyR',true);key(w,'KeyR',true,'keyup');key(w,shift,false,'keyup');await wait(200);}
async function boot(){await until(()=>frame.contentWindow.AYLMER?.radio.libraryReady);const w=frame.contentWindow,d=w.document;
 if(w.AYLMER.G.mode!=='drive'){d.querySelector('#start').click();await wait(150);d.querySelector('#startconfirm').click();await until(()=>w.AYLMER.G.veh,60000);}
 w.AYLMER.cinema.hide();w.AYLMER.story.finish();w.AYLMER.pause(false);w.document.activeElement?.blur();return w;
}
button.onclick=async()=>{button.disabled=true;report=[];let A;
try{
 let w=await boot();A=w.AYLMER;let r=A.radio;
 r.power(false);await wait(200);r.tune('chez106');
 await tap(w,'KeyR');await until(()=>r.on);check('R powers on selected station',r.wantOn&&r.selectedStationId==='chez106',r.state());
 r.seek(22);await wait(200);await tap(w,'KeyR');check('R powers off without tuning',!r.wantOn&&r.selectedStationId==='chez106',r.state());
 await chord(w);check('Shift+R while off selects silently',!r.wantOn&&r.selectedStationId==='cbc-radio-one'&&!A.G.lookBack,r.state());
 await tap(w,'KeyR');await until(()=>r.on);
 A.settings({lookBackToggle:true});await chord(w,'ShiftRight');check('Right Shift chord does not latch rear view',!A.G.lookBack&&r.selectedStationId==='radio-canada',r.state());
 await tap(w,'ShiftLeft');check('Shift alone still toggles rear view',A.G.lookBack===true);await tap(w,'ShiftLeft');check('Shift alone toggles back',A.G.lookBack===false);
 A.settings({lookBackToggle:false});
 const field=w.document.createElement('input');w.document.body.append(field);field.focus();const station=r.selectedStationId;key(w,'KeyR',false,'keydown',field);key(w,'KeyR',false,'keyup',field);await wait(150);check('Text editing does not power or tune',r.wantOn&&r.selectedStationId===station);field.remove();
 const clock=A.visualClock();r.seek(60);await wait(200);const before=r.state().position;A.visualClock((clock+10)%24);await wait(600);check('Broadcast speed independent of game clock',r.state().position-before<2,{before,after:r.state().position});
 await tap(w,'Escape');check('Pause stops media but remembers power',A.G.mode==='paused'&&!r.session&&r.wantOn,r.state());
 const pausePos=r.state().position;await wait(300);check('Position frozen while paused',r.state().position===pausePos);
 w.document.querySelector('#recorded-radio-panel').open=true;
 const sel=w.document.querySelector('[aria-label="Station radio"]');sel.value='oldies1310';sel.dispatchEvent(new w.Event('change'));check('Pause selector keeps silence',r.selectedStationId==='oldies1310'&&!r.session);
 w.document.querySelector('#resume').click();await until(()=>r.on);check('Resume plays pause-menu selection',r.selectedStationId==='oldies1310',r.state());
 const car=A.G.carId,alternate=A.G.parked.saturn?'saturn':Object.keys(A.G.parked).find(id=>id!==car);
 const radioElement=r.session.el,stationBeforeSwap=r.selectedStationId;
 A.G.swapCar(alternate);check('Vehicle swap keeps the same playing radio source',A.G.carId===alternate&&r.on&&r.session.el===radioElement&&r.selectedStationId===stationBeforeSwap,{from:car,to:A.G.carId});A.G.swapCar(car);
 await tap(w,'KeyT');check('Road reset preserves radio',r.on&&r.selectedStationId===stationBeforeSwap);
 r.seek(72);await wait(150);A.save('1');r.persist();const savedId=r.selectedStationId,savedPos=r.state().position;
 await new Promise(resolve=>{frame.onload=resolve;frame.src='../prototype.html?audioReview=1&reload='+Date.now();});await until(()=>frame.contentWindow.AYLMER?.radio.libraryReady);w=frame.contentWindow;A=w.AYLMER;r=A.radio;
 await until(()=>w.document.querySelector('#btnContinue')&&!w.document.querySelector('#btnContinue').disabled);w.document.querySelector('#btnContinue').click();await until(()=>A.G.veh&&r.on,60000);A.cinema.hide();A.story.finish();
 check('Actual page reload restores station and position',r.selectedStationId===savedId&&Math.abs(r.state().position-savedPos)<3,{savedId,savedPos,actual:r.state()});
 const places=await import('../src/game/places.js');const metrics=[];
 for(const [place,weather,hour] of [['home','clear',12],['principale','rain',17],['marina','clear',0]]){
  const p=places.PLACES[place],road=A.G.world.nearestRoad(p.x,p.z);A.teleport(road.x,road.z,road.yaw);A.weather(weather);A.visualClock(hour);A.pause(false);r.power(true);await until(()=>r.on);
  const samples=[];let last=performance.now(),active=true;function measure(t){if(!active)return;samples.push(t-last);last=t;requestAnimationFrame(measure);}requestAnimationFrame(measure);
  A.input.keys.add('KeyW');await wait(6000);A.input.keys.delete('KeyW');active=false;
  const sorted=samples.slice(5).sort((a,b)=>a-b);metrics.push({place,weather,hour,frames:sorted.length,medianMs:sorted[Math.floor(sorted.length*.5)],p95Ms:sorted[Math.floor(sorted.length*.95)],maxMs:Math.max(...sorted),over250ms:sorted.filter(v=>v>250).length,radioTime:r.state().position,radioPlaying:r.on,heapBytes:w.performance.memory?.usedJSHeapSize});
 }
 check('Moving clear/wet/night scene samples keep playback',metrics.every(m=>m.radioPlaying&&m.frames>20),metrics);
 A.pause(true);result.textContent=JSON.stringify({pass:true,report},null,2);
}catch(e){A?.pause(true);result.textContent=JSON.stringify({pass:false,error:e.stack,report},null,2);}finally{button.disabled=false;}
};
</script>
