<!doctype html><meta charset="utf-8"><title>Principale playtest</title><style>body{margin:0;background:#15272b;color:white;font:14px system-ui}button{padding:10px}iframe{width:1200px;height:720px;border:0}pre{white-space:pre-wrap;margin:8px}</style>
<button id="boot">Start isolated playtest</button><button data-view="75,-192,3.14159">Sol / PFK</button><button data-view="-500,-126,3.14159">Garage</button><button data-view="-461,-129,0">Moca / pizza</button><button data-view="-200,-154,0">Stone tower</button><button data-view="-662,-84,0">Old library</button><button data-view="-720,-435,3.14159">Sayyad home</button><button id="dental">Test dental mission</button><button id="repairs">Test repair payment</button><pre id="out">Main save stays on a separate origin.</pre><iframe src="../index.html?principale=21"></iframe>
<script type="module">
const f=document.querySelector('iframe'),out=document.querySelector('#out');let a;
const log=t=>out.textContent+='\n'+t;
const wait=async fn=>{for(let i=0;!fn();i++){if(i>600)throw Error('Timeout');await new Promise(r=>setTimeout(r,100));}};
const check=(p,t)=>{if(!p)throw Error(t);log('PASS '+t);};
const resume=()=>{f.contentDocument.querySelector('#resume')?.click();f.contentWindow.focus();};
document.querySelector('#boot').onclick=async()=>{try{await wait(()=>f.contentWindow.AYLMER);a=f.contentWindow.AYLMER;f.contentDocument.querySelector('#start').click();f.contentDocument.querySelector('#startconfirm').click();await wait(()=>a.cinema.active);a.cinema.finish();a.cinema.finish();await wait(()=>a.G.veh);if(a.G.mission)a.G.failMission('Playtest');a.cinema.finish();await wait(()=>!a.G.seamHold);a.env('day');a.weather('clear');a.teleport(75,-192,Math.PI);resume();log('Ready — all new sites loaded');}catch(e){log('FAIL '+e.stack);}};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{a.env('day');a.teleport(...b.dataset.view.split(',').map(Number));resume();};
document.querySelector('#dental').onclick=async()=>{try{resume();if(a.G.mission)a.G.failMission('Playtest');a.start('margaretdental');a.cinema.finish();a.G.introUntil=0;const before=a.G.wallet.value;for(let stage=0;stage<2;stage++){const p=a.G.mission.target;a.teleport(p.x,p.z,0);for(let i=0;i<30;i++){a.G.introUntil=0;a.input.pressed.add('KeyE');a.step(.1);}log('Stage '+a.G.mission?.idx);}check(!a.G.mission,'dental delivery completes');check(a.G.wallet.value>=before+35,'Margaret bonus paid');}catch(e){log('FAIL '+e.stack);}};
document.querySelector('#repairs').onclick=()=>{try{resume();if(a.G.mission)a.G.failMission('Playtest');a.teleport(-514,-137,Math.PI);a.G.veh.damage=50;a.cinema.finish();a.G.wantStart=false;a.step(.1);const before=a.G.wallet.value;a.input.pressed.add('KeyE');a.step(.1);for(let i=0;i<50;i++)a.step(.1);check(a.G.veh.damage===0,'garage repairs car');check(a.G.wallet.value===before-11,'quote 10 + supplies 1 = 11 charged once');}catch(e){log('FAIL '+e.stack);}};
</script>
