<!doctype html><meta charset="utf-8"><title>Driving and new mission checks</title><style>body{background:#15272b;color:#fff;font:16px sans-serif}button{padding:12px}iframe{width:1200px;height:760px;border:0}pre{white-space:pre-wrap}</style>
<button id="run">Run integration checks</button><button id="hospital">Play hospital challenge</button><button id="status">State</button><pre>Ready. Test origin only; simulated travel.</pre><iframe src="../index.html?life-check=17"></iframe>
<script type="module">
const f=document.querySelector('iframe'),out=document.querySelector('pre');let a;
const wait=async fn=>{let n=0;while(!fn()){if(n++>900)throw Error('Timed out');await new Promise(r=>setTimeout(r,100));}};
const ok=(p,t)=>{if(!p)throw Error(t);out.textContent+='\nPASS '+t;};
document.querySelector('#run').onclick=async()=>{try{out.textContent='Running';await wait(()=>f.contentWindow.AYLMER);a=f.contentWindow.AYLMER;f.contentDocument.querySelector('#start').click();f.contentDocument.querySelector('#startconfirm').click();await wait(()=>a.cinema.active);ok(Math.cos(a.G.veh.yaw-1.672191596275292)>0.99,'Ranger faces the house');a.cinema.finish();a.cinema.finish();
 a.start('russellroyal');a.cinema.finish();let t=a.G.mission.target;ok(t.x>4500&&t.x<6000,'Royal Ottawa destination');a.teleport(t.x,t.z);a.input.pressed.add('KeyE');a.step(1/60);ok(a.G.mission.idx===1&&a.G.veh.passengers===1,'Russell boards');a.cinema.finish();t=a.G.mission.target;a.teleport(t.x,t.z);a.input.pressed.add('KeyE');a.step(1/60);ok(a.G.done.has('russellroyal'),'Russell returns and mission completes');a.cinema.finish();
 a.start('stvincent');a.cinema.finish();t=a.G.mission.target;ok(t.x>9700&&t.x<10300,'Hospital targets Cambridge area');a.teleport(t.x,t.z);a.input.pressed.add('KeyE');a.step(1/60);a.cinema.finish();ok(!!a.G.mealShift,'Hospital activity opens');const before={x:a.G.veh.x,fuel:a.G.fuel};a.G.mealShift.state.served=[3,3,3];await wait(()=>a.G.done.has('stvincent'));ok(!a.G.mealShift,'Activity cleans up after completion');ok(a.G.veh.x===before.x&&a.G.fuel===before.fuel,'Hospital does not drive or burn fuel');a.cinema.finish();out.textContent+='\nALL PASSED';
 }catch(e){out.textContent+='\nFAIL '+e.stack;}};
document.querySelector('#hospital').onclick=async()=>{a=f.contentWindow.AYLMER;a.cinema.finish();a.start('stvincent');a.cinema.finish();const t=a.G.mission.target;a.teleport(t.x,t.z);await wait(()=>!a.G.seamHold);a.input.pressed.add('KeyE');a.step(1/60);a.cinema.finish();};
document.querySelector('#status').onclick=()=>{a=f.contentWindow.AYLMER;out.textContent=JSON.stringify({mode:a.G.mode,seam:a.G.seamHold,cinema:a.cinema.active,job:a.job(),pos:[a.G.veh.x,a.G.veh.z],target:a.G.mission?.target,meal:!!a.G.mealShift,time:a.G.time,input:a.input},null,2);};
</script>
