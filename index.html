<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aylmer Madness</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="topleft">
    <div id="objective">Free roam</div>
    <div id="sub"></div>
  </div>
  <div id="timer" class="hidden">0:00</div>
  <div id="speedo">
    <canvas id="gauge" width="132" height="132"></canvas>
    <div id="speedtext">
      <div id="kmh">0</div><div id="unit">km/h</div>
      <div id="carname">—</div>
    </div>
  </div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="street"></div>
  <div id="toast"></div>
  <div id="prompt" class="hidden"></div>
  <div id="tuto" class="hidden"><span class="cap"></span><span class="txt"></span></div>
  <div id="legend">
    <div id="legendhead">Touches</div>
    <div id="legendrows"></div>
  </div>
  <div id="money">$80</div>
</div>

<div id="menu">
  <div id="menuinner">
    <h1>AYLMER<span>MADNESS</span></h1>
    <p class="tag" id="menutag">Aylmer, Québec &middot; été &rsquo;99 &middot; t&rsquo;as ton permis pis un demi-réservoir</p>
    <div id="menucols">
      <div id="menuside">
        <button id="btnContinue" class="ghost">Continuer</button>
        <button id="start">EMBARQUE &#9656; nouvelle partie</button>
        <button id="btnLoad" class="ghost">Charger</button>
        <button id="btnOptions" class="ghost">Options</button>
        <a id="btnGarage" class="ghost" href="garage.html">Le garage</a>
        <div id="contmeta"></div>
      </div>
      <div id="menumain">
        <div id="carspick">Choisis ton char</div>
        <div id="cars"></div>
      </div>
    </div>
    <div id="menukeys"></div>
  </div>
</div>

<canvas id="bigmap" class="hidden"></canvas>

<div id="pause" class="hidden">
  <div class="panel">
    <h2 id="pausetitle">Pause</h2>
    <div id="ptabs"></div>
    <div id="tabjobs" class="ptab">
      <div id="jobs"></div>
      <p class="hint" id="jobshint"></p>
      <div class="row"><button id="carshome" class="ghost">Remettre les chars chez eux</button></div>
    </div>
    <div id="tabsave" class="ptab hidden"></div>
    <div id="tabopt" class="ptab hidden"></div>
    <div id="tabkeys" class="ptab hidden"></div>
    <div class="row">
      <button id="resume">Continuer</button>
      <button id="mapbtn">Carte</button>
      <button id="garage">Menu</button>
    </div>
  </div>
</div>

<div id="options" class="hidden">
  <div class="panel wide">
    <div class="topbar"><button id="optback2" class="ghost">&larr; Retour</button><span class="hint">Esc</span></div>
    <h2 id="opttitle">Options</h2>
    <div id="optbody"></div>
    <div class="row"><button id="optback">Retour</button></div>
  </div>
</div>

<div id="loadscr" class="hidden">
  <div class="panel wide">
    <div class="topbar"><button id="loadback2" class="ghost">&larr; Retour</button><span class="hint">Esc</span></div>
    <h2 id="loadtitle">Charger</h2>
    <div id="loadbody"></div>
    <div class="row"><button id="loadback">Retour</button></div>
  </div>
</div>

<div id="fps" class="hidden">60 fps</div>

<div id="loading" class="hidden">
  <div class="lbox">
    <div class="ltitle">ON BÂTIT AYLMER</div>
    <div class="lbar"><i></i></div>
    <div class="lstage">Rues…</div>
  </div>
</div>

<div id="intro" class="hidden">
  <div class="icard">
    <div class="ititle"></div>
    <div class="ibrief"></div>
    <div class="itime"></div>
    <canvas class="iroute" width="360" height="210"></canvas>
  </div>
</div>

<!-- driving agent (R4 / D5): damage bar and reverse indicator. Kept out of
     #hud on purpose so a rework of the HUD markup doesn't collide with it;
     both are positioned from the rules at the end of style.css. -->
<div id="dmgwrap" class="hidden">
  <span id="dmglabel">DOMMAGE</span>
  <u id="dmgbar"><i id="dmgfill"></i></u>
</div>
<div id="gear" class="hidden">R</div>
<!-- race agent (G4): the wanted meter. Same corner as the damage bar. -->
<div id="stars" class="hidden">☆☆☆</div>

<!-- progression agent (Goal C): the radio's one line. Station on the left,
     what is playing after it. R cycles CKOI -> cassette -> off. Kept outside
     #hud for the same reason the damage bar is. -->
<div id="radio" class="hidden">
  <b id="radiostation">CKOI 102.1</b>
  <span id="radiotrack"></span>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
